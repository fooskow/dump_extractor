name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # serve per pubblicare l'APK nella sezione Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa piattaforma, build-tools e NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Compila hactool per Android arm64
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          bash native/build-hactool.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compila l'APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Controlla il contenuto dell'APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libhactool.so|AndroidManifest.xml|classes.dex'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhactool.so'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

      - name: Salva l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchExtractor-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Pubblica nella sezione Releases (link diretto da scaricare)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SwitchExtractor.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest SwitchExtractor.apk \
            --title "Switch Extractor (ultima build)" \
            --notes "APK firmato, build automatica del commit ${GITHUB_SHA::7}."
